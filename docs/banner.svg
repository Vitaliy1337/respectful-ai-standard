<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="40%" stop-color="#0c101a" />
      <stop offset="80%" stop-color="#111625" />
      <stop offset="100%" stop-color="#18132b" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glow-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Cyber Glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-indigo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .title { font-weight: 800; letter-spacing: -0.03em; }
    .badge { font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-grad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="180" fill="#6366f1" fill-opacity="0.12" filter="url(#glow-indigo)" />
  <circle cx="1050" cy="340" r="220" fill="#06b6d4" fill-opacity="0.12" filter="url(#glow-cyan)" />
  <circle cx="980" cy="100" r="140" fill="#a855f7" fill-opacity="0.1" filter="url(#glow-indigo)" />

  <!-- Border Frame -->
  <rect x="16" y="16" width="1168" height="388" rx="16" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.6" />
  <rect x="20" y="20" width="1160" height="380" rx="12" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="8 8" stroke-opacity="0.4" />

  <!-- Top Status Badge -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="370" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="16" cy="14" r="5" fill="#10b981" filter="url(#glow-cyan)" />
    <text x="32" y="18" fill="#38bdf8" class="mono badge" font-size="11">RAHSPS STANDARD v3.0 • ZERO-SHLAK GATE</text>
  </g>

  <!-- Respect & Signal Gate Standard -->
  <!-- Main Hero Brand Title -->
  <g transform="translate(60, 135)">
    <text x="0" y="0" fill="url(#accent-cyan)" class="sans title" font-size="64" filter="url(#glow-cyan)">RAHSPS</text>
    <text x="290" y="-8" fill="#94a3b8" class="sans" font-size="28" font-weight="300">|</text>
    <text x="315" y="-6" fill="#f8fafc" class="sans" font-size="28" font-weight="700">Respect &amp; Signal Gate</text>
  </g>

  <!-- Subtitle Manifesto -->
  <g transform="translate(60, 175)">
    <text x="0" y="0" fill="#cbd5e1" class="sans" font-size="20" font-weight="500">
      Respectful AI &amp; High-Signal Prompting Standard
    </text>
    <text x="0" y="28" fill="#94a3b8" class="sans" font-size="14" font-weight="400">
      Stop feeding cognitive garbage to autonomous LLM agents. Attention physics, KV-cache hygiene &amp; prompt governance.
    </text>
  </g>

  <!-- Attention Formula Graphic Box (Right Side) -->
  <g transform="translate(680, 52)">
    <rect x="0" y="0" width="460" height="175" rx="14" fill="url(#glow-card)" stroke="#475569" stroke-width="1.2" stroke-opacity="0.6" />
    <rect x="0" y="0" width="460" height="34" rx="14" fill="#1e293b" fill-opacity="0.6" />
    <!-- Window Dots -->
    <circle cx="20" cy="17" r="4.5" fill="#ef4444" />
    <circle cx="36" cy="17" r="4.5" fill="#f59e0b" />
    <circle cx="52" cy="17" r="4.5" fill="#10b981" />
    <text x="75" y="21" fill="#94a3b8" class="mono" font-size="11">attention_preservation_kernel.tex</text>

    <!-- Formula Display -->
    <g transform="translate(24, 75)">
      <text x="0" y="0" fill="#38bdf8" class="mono" font-size="16" font-weight="700">Attention(Q, K, V) = softmax(</text>
      <text x="282" y="-10" fill="#f43f5e" class="mono" font-size="15" font-weight="700">Q · K</text>
      <text x="328" y="-16" fill="#f43f5e" class="mono" font-size="11">T</text>
      <line x1="280" y1="-3" x2="340" y2="-3" stroke="#f43f5e" stroke-width="1.5" />
      <text x="294" y="16" fill="#f43f5e" class="mono" font-size="14">√d_k</text>
      <text x="345" y="0" fill="#38bdf8" class="mono" font-size="16" font-weight="700">) V</text>
    </g>

    <!-- Subspace Indicator -->
    <g transform="translate(24, 130)">
      <rect x="0" y="0" width="412" height="28" rx="6" fill="#090d16" stroke="#334155" stroke-width="0.8" />
      <text x="12" y="18" fill="#10b981" class="mono" font-size="11">✔ PREFIX STEERING:</text>
      <text x="145" y="18" fill="#e2e8f0" class="mono" font-size="11">«Respected Agent» → High-Coherence Subspace</text>
    </g>
  </g>

  <!-- Bottom Interactive Matrix Features -->
  <g transform="translate(60, 260)">
    <!-- Feature 1: Universal Agent Matrices -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="345" height="115" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="28" r="14" fill="#6366f1" fill-opacity="0.2" />
      <text x="22" y="34" fill="#818cf8" class="sans" font-size="16">🤖</text>
      <text x="54" y="32" fill="#f1f5f9" class="sans" font-size="15" font-weight="700">Universal Agent Matrix</text>
      <text x="20" y="62" fill="#94a3b8" class="sans" font-size="12">Drop-in rulebooks for Cursor, Claude Code,</text>
      <text x="20" y="80" fill="#94a3b8" class="sans" font-size="12">Gemini, Windsurf, Cline &amp; Codex CLI.</text>
      <text x="20" y="100" fill="#38bdf8" class="mono" font-size="11">AGENTS.md • CLAUDE.md • .cursorrules</text>
    </g>

    <!-- Feature 2: Machine Indexing -->
    <g transform="translate(365, 0)">
      <rect x="0" y="0" width="345" height="115" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="28" r="14" fill="#06b6d4" fill-opacity="0.2" />
      <text x="22" y="34" fill="#22d3ee" class="sans" font-size="16">⚡</text>
      <text x="54" y="32" fill="#f1f5f9" class="sans" font-size="15" font-weight="700">AI-Crawler &amp; llms.txt Native</text>
      <text x="20" y="62" fill="#94a3b8" class="sans" font-size="12">Standardized index directive for RAG bots,</text>
      <text x="20" y="80" fill="#94a3b8" class="sans" font-size="12">Perplexity, ClaudeBot &amp; GPTBot search.</text>
      <text x="20" y="100" fill="#22d3ee" class="mono" font-size="11">llms.txt • llms-full.txt • CITATION.cff</text>
    </g>

    <!-- Feature 3: CLI Linter & 7 Languages -->
    <g transform="translate(730, 0)">
      <rect x="0" y="0" width="410" height="115" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <circle cx="28" cy="28" r="14" fill="#10b981" fill-opacity="0.2" />
      <text x="22" y="34" fill="#34d399" class="sans" font-size="16">🛡️</text>
      <text x="54" y="32" fill="#f1f5f9" class="sans" font-size="15" font-weight="700">respect-lint &amp; 7-Language i18n</text>
      <text x="20" y="62" fill="#94a3b8" class="sans" font-size="12">Zero-dependency Python CLI prompt linter &amp;</text>
      <text x="20" y="80" fill="#94a3b8" class="sans" font-size="12">interactive Web Playground (EN, RU, ZH, ES...)</text>
      <text x="20" y="100" fill="#34d399" class="mono" font-size="11">pip install -e . • 100% Zero-Defect CI</text>
    </g>
  </g>
</svg>
